<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checking payment</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="night.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="scr screen-in" style="font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #F5F7FA">
  <div class="glow glow-blue" aria-hidden="true"></div>
  <span class="star" aria-hidden="true" style="left: 48px; top: 150px"></span>
  <span class="star" aria-hidden="true" style="left: 320px; top: 120px; animation-delay: 1s"></span>
  <span class="star" aria-hidden="true" style="left: 270px; top: 230px; animation-delay: .5s"></span>

  <div class="sb" aria-hidden="true">
    <span class="num">10:42</span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.1-1.1A10 10 0 0 0 8 1 10 10 0 0 0 .9 3.9L2 5a8.4 8.4 0 0 1 6-2.4zm0 3.3c1.4 0 2.6.5 3.6 1.4l1.1-1.1A6.7 6.7 0 0 0 8 4.3a6.7 6.7 0 0 0-4.7 1.9l1.1 1.1c1-.9 2.2-1.4 3.6-1.4zM8 11.2 10.2 9a3.1 3.1 0 0 0-4.4 0z"></path></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"></rect><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"></rect><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".45"></path></svg>
    </span>
  </div>
  <div class="topbar" aria-hidden="true"></div>

  <main class="content state" aria-live="polite">
    <div class="loader pop" role="img" aria-label="Checking payment status" style="width: 131px; height: 131px">
      <svg class="ring" width="52" height="52" viewBox="0 0 52 52" fill="none" style="width: 128px; height: 128px">
        <defs><linearGradient id="arc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9BBEFF"></stop><stop offset="1" stop-color="#3B74FF"></stop></linearGradient></defs>
        <circle cx="26" cy="26" r="22" stroke="rgba(255,255,255,.08)" stroke-width="4"></circle>
        <path d="M26 4a22 22 0 0 1 22 22" stroke="url(#arc)" stroke-width="4" stroke-linecap="round"></path>
      </svg>
      <span class="coin-stage" aria-hidden="true" style="width: 130px; height: 129px; top: 2px; left: 2px"><span class="coin coin-blue spin3d" style="width: 65px; height: 66px"><i style="font-weight: 500; font-size: 40px; color: #FFFFFF; width: 77px; height: 79px; left: -7px; top: -8px">₹</i><i style="font-weight: 700; font-style: normal; width: 76px; height: 78px; left: -6px; top: -8px">₹</i></span></span>
    </div>
    <span class="rise d2" style="margin-top: 32px; display: inline-flex; align-items: center; height: 28px; font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: -.005em; color: #7EEBAE">Your money is safe</span>
    <h1 class="t-h1 rise d3" style="margin-top: 14px; max-width: 280px">We’re checking your payment</h1>
    <p class="t-body rise d4" style="margin-top: 10px; max-width: 300px">The bank hasn’t confirmed the status yet. This usually takes a few seconds.</p>
    <div class="track rise d5" style="margin-top: 24px" role="progressbar" aria-label="Confirming with your bank"><span></span></div>
  </main>

  <div class="footer rise d6">
    <span class="footnote">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.5"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
      Secured by UPI
    </span>
  </div>
  <div class="hi" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"go":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    if (this.props.go) this._t = setTimeout(() => this.props.go('status'), 2800);
  }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() { return {}; }
}
</script>
</body>
</html>
