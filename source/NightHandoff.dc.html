<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Connecting you to an expert</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="night.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="scr screen-in" style="font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #F5F7FA">
  <div class="glow glow-blue" aria-hidden="true"></div>
  <div class="sb" aria-hidden="true">
    <span class="num">10:47</span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.1-1.1A10 10 0 0 0 8 1 10 10 0 0 0 .9 3.9L2 5a8.4 8.4 0 0 1 6-2.4zm0 3.3c1.4 0 2.6.5 3.6 1.4l1.1-1.1A6.7 6.7 0 0 0 8 4.3a6.7 6.7 0 0 0-4.7 1.9l1.1 1.1c1-.9 2.2-1.4 3.6-1.4zM8 11.2 10.2 9a3.1 3.1 0 0 0-4.4 0z"></path></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"></rect><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"></rect><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".45"></path></svg>
    </span>
  </div>
  <div class="topbar">
    <button class="icon-btn" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </button>
  </div>

  <main class="content" style="gap: 32px">
    <header style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px">
      <span class="chip chip-blue rise d1"><span class="live-dot blue"></span>Escalated</span>
      <h1 class="t-h1 rise d2">Connecting you to an expert</h1>
      <p class="t-body rise d3">We’re escalating your case for manual review. You don’t need to do anything.</p>
    </header>

    <ol class="tl rise d4" aria-live="polite">
      <li class="tl-step">
        <div class="tl-rail">
          <span class="tl-node {{s1.cls}}">
            <sc-if value="{{s1.done}}" hint-placeholder-val="{{false}}"><svg class="pop" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
            <sc-if value="{{s1.notDone}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg></sc-if>
          </span>
          <span class="tl-line"><span class="bar {{s1.bar}}"></span></span>
        </div>
        <div class="tl-body">
          <span class="t-head">Automated review</span>
          <span class="t-cap {{s1.subCls}}">{{s1.sub}}</span>
        </div>
      </li>
      <li class="tl-step">
        <div class="tl-rail">
          <span class="tl-node {{s2.cls}}">
            <sc-if value="{{s2.done}}" hint-placeholder-val="{{false}}"><svg class="pop" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
            <sc-if value="{{s2.notDone}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"></path></svg></sc-if>
          </span>
          <span class="tl-line"><span class="bar {{s2.bar}}"></span></span>
        </div>
        <div class="tl-body">
          <span class="t-head" style="color: {{s2.titleColor}}">Connecting to a support agent</span>
          <span class="t-cap {{s2.subCls}}">{{s2.sub}}</span>
        </div>
      </li>
      <li class="tl-step">
        <div class="tl-rail">
          <span class="tl-node {{s3.cls}}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 22h18"></path><path d="M6 18v-7"></path><path d="M10 18v-7"></path><path d="M14 18v-7"></path><path d="M18 18v-7"></path><path d="M12 2l9 5H3z"></path></svg>
          </span>
        </div>
        <div class="tl-body">
          <span class="t-head" style="color: {{s3.titleColor}}">Bank resolution</span>
          <span class="t-cap {{s3.subCls}}">{{s3.sub}}</span>
        </div>
      </li>
    </ol>
  </main>

  <div class="footer rise d6">
    <section class="group" aria-label="Your support agent">
      <div class="cell">
        <span style="position: relative; flex: none">
          <span class="avatar" style="background: linear-gradient(180deg, #9DBEFF, #2D63F0); color: #FFFFFF; box-shadow: inset 0 1px 0 rgba(255,255,255,.45)">JD</span>
          <span style="position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border-radius: 99px; background: #3DDC84; box-shadow: 0 0 0 2.5px #111419"></span>
        </span>
        <div class="cell-text">
          <span class="t-head">Support agent · JD</span>
          <span class="t-cap">Usually replies in <span class="num">1–2 min</span></span>
        </div>
        <span class="chip {{agentChip}}">{{agentLabel}}</span>
      </div>
    </section>
  </div>
  <div class="hi" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"go":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { p: 0 }; }
  componentDidMount() {
    this._a = setTimeout(() => this.setState({ p: 1 }), 1200);
    this._b = setTimeout(() => this.setState({ p: 2 }), 3000);
    if (this.props.go) this._c = setTimeout(() => this.props.go('success'), 5600);
  }
  componentWillUnmount() { clearTimeout(this._a); clearTimeout(this._b); clearTimeout(this._c); }
  renderVals() {
    const p = this.state.p;
    const step = (i, subs) => {
      const done = p > i, active = p === i;
      return {
        done, notDone: !done,
        cls: done ? 'done' : active ? 'active blue' : 'todo',
        bar: done ? 'on' : '',
        sub: done ? subs[0] : active ? subs[1] : subs[2],
        subCls: active ? 'dots' : '',
        titleColor: done || active ? '#F5F7FA' : '#A9B1BE'
      };
    };
    return {
      s1: step(0, ['Transaction logs checked · 10:47 AM', 'Checking transaction logs', 'Checking transaction logs']),
      s2: step(1, ['JD has joined your case', 'Finding an available agent', 'Next: a human agent takes over']),
      s3: step(2, ['Resolved with your bank', 'Contacting your bank for you', 'We’ll contact the bank for you']),
      agentChip: p >= 2 ? 'chip-green' : 'chip-blue',
      agentLabel: p >= 2 ? 'Joined' : 'Connecting'
    };
  }
}
</script>
</body>
</html>
