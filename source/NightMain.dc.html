<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UPI pending payment — Midnight prototype</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="night.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden">
  <div class="layer layer-out" aria-hidden="true">
    <sc-if value="{{was.checking}}" hint-placeholder-val="{{false}}"><dc-import name="NightChecking" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{was.status}}"><dc-import name="NightStatus" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{was.explainer}}"><dc-import name="NightExplainer" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{was.waiting}}"><dc-import name="NightWaiting" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{was.notification}}"><dc-import name="NightNotification" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{was.escalation}}"><dc-import name="NightEscalation" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{was.handoff}}"><dc-import name="NightHandoff" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{was.success}}"><dc-import name="NightSuccess" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{was.reassurance}}"><dc-import name="NightReassurance" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{was.duplicate}}"><dc-import name="NightDuplicate" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{was.refunded}}"><dc-import name="NightRefunded" hint-size="390px,844px"></dc-import></sc-if>
  </div>
  <div class="layer layer-in">
    <sc-if value="{{is.checking}}" hint-placeholder-val="{{true}}"><dc-import name="NightChecking" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{is.status}}"><dc-import name="NightStatus" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{is.explainer}}"><dc-import name="NightExplainer" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{is.waiting}}"><dc-import name="NightWaiting" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{is.notification}}"><dc-import name="NightNotification" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{is.escalation}}"><dc-import name="NightEscalation" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{is.handoff}}"><dc-import name="NightHandoff" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{is.success}}"><dc-import name="NightSuccess" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{is.reassurance}}"><dc-import name="NightReassurance" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{is.duplicate}}"><dc-import name="NightDuplicate" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
    <sc-if value="{{is.refunded}}"><dc-import name="NightRefunded" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cur: 'checking', prev: '' };
    this.go = (id) => {
      clearTimeout(this._t); clearTimeout(this._r);
      const cur = this.state.cur;
      if (id === cur) {
        this.setState({ cur: '', prev: cur });
        this._r = setTimeout(() => this.setState({ cur: id }), 30);
      } else {
        this.setState({ cur: id, prev: cur });
      }
      this._t = setTimeout(() => this.setState({ prev: '' }), 420);
    };
  }
  componentWillUnmount() { clearTimeout(this._t); clearTimeout(this._r); }
  renderVals() {
    const B = '#5B95FF', A = '#FFB547', G = '#3DDC84';
    const list = [
      ['checking', '01', 'Checking payment', B],
      ['status', '02', 'Payment status', A],
      ['explainer', '03', 'Explainer sheet', A],
      ['waiting', '04', 'Still waiting', A],
      ['notification', '05', 'Payment update', B],
      ['escalation', '06', 'Escalation · 5 min', A],
      ['handoff', '07', 'Support handoff', B],
      ['success', '08', 'Resolved · success', G],
      ['reassurance', '09', 'Reassurance', B],
      ['duplicate', '10', 'Duplicate guardrail', A],
      ['refunded', '11', 'Resolved · refunded', B]
    ];
    const { cur, prev } = this.state;
    const is = {}, was = {};
    list.forEach(([id]) => { is[id] = cur === id; was[id] = prev === id && prev !== cur; });
    return {
      is, was,
      go: this.go,
      screens: list.map(([id, n, label, dot]) => ({
        n, label, dot,
        cls: cur === id ? 'on' : '',
        current: cur === id ? 'step' : 'false',
        pick: () => this.go(id)
      }))
    };
  }
}
</script>
</body>
</html>
