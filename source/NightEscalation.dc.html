<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Taking longer than expected</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="night.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="scr screen-in" style="font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #F5F7FA">
  <div class="glow glow-amber" aria-hidden="true"></div>
  <div class="sb" aria-hidden="true">
    <span class="num">10:47</span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.1-1.1A10 10 0 0 0 8 1 10 10 0 0 0 .9 3.9L2 5a8.4 8.4 0 0 1 6-2.4zm0 3.3c1.4 0 2.6.5 3.6 1.4l1.1-1.1A6.7 6.7 0 0 0 8 4.3a6.7 6.7 0 0 0-4.7 1.9l1.1 1.1c1-.9 2.2-1.4 3.6-1.4zM8 11.2 10.2 9a3.1 3.1 0 0 0-4.4 0z"></path></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"></rect><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"></rect><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".45"></path></svg>
    </span>
  </div>
  <div class="topbar">
    <button class="icon-btn" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </button>
  </div>

  <main class="content">
    <header style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px">
      <span class="chip chip-amber rise d1"><span class="num">5 min</span> since payment</span>
      <h1 class="t-h1 rise d2">It’s taking longer than expected</h1>
      <p class="t-body rise d3">The bank hasn’t responded yet. Since it’s been over 5 minutes, our support team can now look into this directly.</p>
    </header>

    <section class="group rise d4" aria-label="Transaction details">
      <div class="row"><span class="lbl">Amount</span><span class="val num">₹450.00</span></div>
      <div class="row"><span class="lbl">To</span><span class="val">Swiggy Instamart</span></div>
      <div class="row">
        <span class="lbl">Ref ID</span>
        <span style="display: flex; align-items: center; gap: 4px; margin-right: -12px">
          <span class="mono">UPI-928374</span>
          <button class="icon-btn bare" aria-label="Copy reference ID" onClick="{{copy}}">
            <sc-if value="{{copied}}" hint-placeholder-val="{{false}}">
              <svg class="pop" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3DDC84" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
            </sc-if>
            <sc-if value="{{notCopied}}" hint-placeholder-val="{{true}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9B1BE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </sc-if>
          </button>
        </span>
      </div>
    </section>

    <section class="group rise d5" aria-label="Priority support">
      <div class="cell">
        <span class="seal seal-blue seal-sm">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
        </span>
        <div class="cell-text">
          <span class="t-head">Priority support</span>
          <span class="t-callout">Current response time <span class="strong num" style="color: #9BBEFF">~2 min</span></span>
        </div>
        <span class="live-dot blue" aria-hidden="true" style="margin-right: 4px"></span>
      </div>
    </section>
  </main>

  <div class="footer rise d6">
    <button class="btn btn-primary" onClick="{{chat}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      Chat with support
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
    </button>
  </div>
  <div class="hi" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"go":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { copied: false }; }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const go = this.props.go;
    return {
      copied: this.state.copied,
      notCopied: !this.state.copied,
      copy: () => {
        try { navigator.clipboard && navigator.clipboard.writeText('UPI-928374'); } catch (e) {}
        this.setState({ copied: true });
        clearTimeout(this._t);
        this._t = setTimeout(() => this.setState({ copied: false }), 1600);
      },
      chat: () => { if (go) go('handoff'); }
    };
  }
}
</script>
</body>
</html>
