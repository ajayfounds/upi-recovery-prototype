<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Payment status</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="day.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="scr screen-in" style="font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #0B1220">
  <div class="glow glow-amber" aria-hidden="true"></div>
  <div class="sb" aria-hidden="true">
    <span class="num">10:43</span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.1-1.1A10 10 0 0 0 8 1 10 10 0 0 0 .9 3.9L2 5a8.4 8.4 0 0 1 6-2.4zm0 3.3c1.4 0 2.6.5 3.6 1.4l1.1-1.1A6.7 6.7 0 0 0 8 4.3a6.7 6.7 0 0 0-4.7 1.9l1.1 1.1c1-.9 2.2-1.4 3.6-1.4zM8 11.2 10.2 9a3.1 3.1 0 0 0-4.4 0z"></path></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"></rect><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"></rect><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".45"></path></svg>
    </span>
  </div>
  <div class="topbar">
    <button class="icon-btn" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </button>
    <span class="topbar-title">Payment status</span>
  </div>

  <main class="content" style="gap: 32px">
    <section class="stack" style="gap: 8px; text-align: center">
      <span class="t-callout rise d1">To <span class="strong">Swiggy Instamart</span></span>
      <p class="amount chrome rise d2" aria-label="₹450.00"><span class="cur">₹</span><span class="cnt"><span class="ghost">450</span><span class="count" aria-hidden="true"></span></span><span class="dec">.00</span></p>
      <span class="rise d3" style="display: inline-flex; align-items: center; height: 28px; font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: -.005em; color: #8A4E00">Pending confirmation</span>
    </section>

    <ol class="tl" aria-label="Payment progress">
      <li class="tl-step rise d3">
        <div class="tl-rail">
          <span class="tl-node done"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
          <span class="tl-line"><span class="bar bar-grow" style="animation-delay: 350ms"></span></span>
        </div>
        <div class="tl-body"><span class="t-head">Payment initiated</span><span class="t-cap num">10:42 AM</span></div>
      </li>
      <li class="tl-step rise d4">
        <div class="tl-rail">
          <span class="tl-node done"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
          <span class="tl-line"><span class="bar bar-grow" style="animation-delay: 500ms; background: linear-gradient(180deg, #0F8A45, #E08A00)"></span></span>
        </div>
        <div class="tl-body"><span class="t-head">Sent to bank</span><span class="t-cap num">10:42 AM</span></div>
      </li>
      <li class="tl-step rise d5" aria-current="step">
        <div class="tl-rail">
          <span class="tl-node active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 22h18"></path><path d="M6 18v-7"></path><path d="M10 18v-7"></path><path d="M14 18v-7"></path><path d="M18 18v-7"></path><path d="M12 2l9 5H3z"></path></svg></span>
          <span class="tl-line"></span>
        </div>
        <div class="tl-body"><span class="t-head">Awaiting confirmation</span><span class="t-cap shimmer">In progress with your bank</span></div>
      </li>
      <li class="tl-step rise d6">
        <div class="tl-rail">
          <span class="tl-node todo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg></span>
        </div>
        <div class="tl-body"><span class="t-head" style="color: #4A5363">Resolution expected</span><span class="t-cap num" style="color: #8A4E00; font-weight: 600">By 10:45 AM</span></div>
      </li>
    </ol>
  </main>

  <div class="footer rise d7">
    <button class="btn btn-secondary" onClick="{{toExplainer}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg>
      What does this mean?
    </button>
  </div>
  <div class="hi" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"go":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    if (this.props.go) this._t = setTimeout(() => this.props.go('waiting'), 7000);
  }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const go = this.props.go;
    return { toExplainer: () => { if (go) go('explainer'); } };
  }
}
</script>
</body>
</html>
