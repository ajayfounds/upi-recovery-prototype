<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UPI pending payment — Daylight prototype</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="day.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1180px; height: 1000px; box-sizing: border-box; position: relative; overflow: hidden; background: #EBEDF1; display: flex; gap: 64px; padding: 56px 64px; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #0B1220; -webkit-font-smoothing: antialiased">
  <div aria-hidden="true" style="position: absolute; right: -200px; top: -200px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(closest-side, rgba(74,130,255,.18), transparent); pointer-events: none"></div>
  <aside style="width: 380px; flex: none; display: flex; flex-direction: column; gap: 24px; position: relative">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <p class="t-over">UPI · Pending payment recovery · Daylight</p>
      <h1 style="margin: 0; font-size: 36px; line-height: 42px; font-weight: 600; letter-spacing: -0.035em">Interactive prototype</h1>
      <p style="margin: 0; font-size: 15px; line-height: 23px; color: #4A5363">The light twin of Midnight: same screens, same 400 ms clock. Glow colour tracks the payment: blue checking, amber waiting, green safe.</p>
    </div>
    <nav aria-label="Flow states" style="background: #FFFFFF; border-radius: 26px; padding: 8px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 0 0 1px rgba(11,18,32,.05), 0 12px 32px -16px rgba(11,18,32,.16)">
      <sc-for list="{{screens}}" as="item" hint-placeholder-count="11">
        <button class="nav-item {{item.cls}}" onClick="{{item.pick}}" aria-current="{{item.current}}">
          <span class="n">{{item.n}}</span>
          <span style="flex: 1">{{item.label}}</span>
          <span style="width: 8px; height: 8px; border-radius: 99px; background: {{item.dot}}"></span>
        </button>
      </sc-for>
    </nav>
    <button class="btn btn-secondary" onClick="{{replay}}" style="height: 48px">
      <svg class="spin-hover" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path><path d="M3 21v-5h5"></path></svg>
      Replay from the start
    </button>
  </aside>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; position: relative">
    <div class="device">
      <div class="device-screen">
        <div class="layer layer-out" aria-hidden="true">
          <sc-if value="{{was.checking}}" hint-placeholder-val="{{false}}"><dc-import name="DayChecking" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{was.status}}"><dc-import name="DayStatus" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{was.explainer}}"><dc-import name="DayExplainer" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{was.waiting}}"><dc-import name="DayWaiting" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{was.notification}}"><dc-import name="DayNotification" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{was.escalation}}"><dc-import name="DayEscalation" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{was.handoff}}"><dc-import name="DayHandoff" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{was.success}}"><dc-import name="DaySuccess" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{was.reassurance}}"><dc-import name="DayReassurance" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{was.duplicate}}"><dc-import name="DayDuplicate" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{was.refunded}}"><dc-import name="DayRefunded" hint-size="390px,844px"></dc-import></sc-if>
        </div>
        <div class="layer layer-in">
          <sc-if value="{{is.checking}}" hint-placeholder-val="{{true}}"><dc-import name="DayChecking" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{is.status}}"><dc-import name="DayStatus" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{is.explainer}}"><dc-import name="DayExplainer" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{is.waiting}}"><dc-import name="DayWaiting" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{is.notification}}"><dc-import name="DayNotification" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{is.escalation}}"><dc-import name="DayEscalation" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{is.handoff}}"><dc-import name="DayHandoff" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{is.success}}"><dc-import name="DaySuccess" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{is.reassurance}}"><dc-import name="DayReassurance" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{is.duplicate}}"><dc-import name="DayDuplicate" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{is.refunded}}"><dc-import name="DayRefunded" go="{{go}}" hint-size="390px,844px"></dc-import></sc-if>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cur: 'checking', prev: '' };
    this.go = (id) => {
      clearTimeout(this._t); clearTimeout(this._r);
      const cur = this.state.cur;
      if (id === cur) {
        this.setState({ cur: '', prev: cur });
        this._r = setTimeout(() => this.setState({ cur: id }), 30);
      } else {
        this.setState({ cur: id, prev: cur });
      }
      this._t = setTimeout(() => this.setState({ prev: '' }), 420);
    };
  }
  componentWillUnmount() { clearTimeout(this._t); clearTimeout(this._r); }
  renderVals() {
    const B = '#2F6BFF', A = '#E08A00', G = '#0F8A45';
    const list = [
      ['checking', '01', 'Checking payment', B],
      ['status', '02', 'Payment status', A],
      ['explainer', '03', 'Explainer sheet', A],
      ['waiting', '04', 'Still waiting', A],
      ['notification', '05', 'Payment update', B],
      ['escalation', '06', 'Escalation · 5 min', A],
      ['handoff', '07', 'Support handoff', B],
      ['success', '08', 'Resolved · success', G],
      ['reassurance', '09', 'Reassurance', B],
      ['duplicate', '10', 'Duplicate guardrail', A],
      ['refunded', '11', 'Resolved · refunded', B]
    ];
    const { cur, prev } = this.state;
    const is = {}, was = {};
    list.forEach(([id]) => { is[id] = cur === id; was[id] = prev === id && prev !== cur; });
    return {
      is, was,
      go: this.go,
      replay: () => this.go('checking'),
      screens: list.map(([id, n, label, dot]) => ({
        n, label, dot,
        cls: cur === id ? 'on' : '',
        current: cur === id ? 'step' : 'false',
        pick: () => this.go(id)
      }))
    };
  }
}
</script>
</body>
</html>
