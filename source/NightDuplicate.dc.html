<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Possible duplicate payment</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="night.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="scr screen-in" style="font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #F5F7FA">
  <div class="glow glow-amber" aria-hidden="true"></div>
  <div class="sb" aria-hidden="true">
    <span class="num">10:43</span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.1-1.1A10 10 0 0 0 8 1 10 10 0 0 0 .9 3.9L2 5a8.4 8.4 0 0 1 6-2.4zm0 3.3c1.4 0 2.6.5 3.6 1.4l1.1-1.1A6.7 6.7 0 0 0 8 4.3a6.7 6.7 0 0 0-4.7 1.9l1.1 1.1c1-.9 2.2-1.4 3.6-1.4zM8 11.2 10.2 9a3.1 3.1 0 0 0-4.4 0z"></path></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"></rect><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"></rect><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".45"></path></svg>
    </span>
  </div>
  <div class="topbar">
    <span style="width: 44px"></span>
    <button class="icon-btn" aria-label="Cancel payment" onClick="{{wait}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </button>
  </div>

  <main class="content state" role="alertdialog" aria-labelledby="dup-title" aria-describedby="dup-desc">
    <div class="seal seal-amber pop">
      <span class="nudge"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></span>
    </div>
    <span class="rise d2" style="margin-top: 32px; display: inline-flex; align-items: center; height: 28px; font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: -.005em; color: #FFCF85">Same amount · 1 min ago</span>
    <h1 id="dup-title" class="t-h1 rise d3" style="margin-top: 14px">Possible duplicate payment</h1>
    <p id="dup-desc" class="t-body rise d4" style="margin-top: 10px; max-width: 316px">Check your bank statement before paying this merchant again.</p>

    <section class="group rise d5" style="margin-top: 28px" aria-label="Earlier payment">
      <div class="cell">
        <span class="avatar" style="background: url(&quot;../assets/swiggy-logo.jpg&quot;) center / contain no-repeat; border-radius: 999px; opacity: 1"><br></span>
        <div class="cell-text">
          <span class="t-head">Swiggy Instamart</span>
          <span class="t-cap num">Paid at 10:42 AM</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
          <span class="num strong" style="font-size: 16px">₹450.00</span>
          <span class="t-cap" style="color: #FFCF85; font-weight: 600">Pending</span>
        </div>
      </div>
    </section>
  </main>

  <div class="footer rise d6">
    <button class="btn btn-primary" onClick="{{wait}}">Wait, let me check</button>
    <button class="btn btn-ghost" onClick="{{again}}">Yes, send again</button>
  </div>
  <div class="hi" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"go":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const go = this.props.go;
    return {
      wait: () => { if (go) go('refunded'); },
      again: () => { if (go) go('checking'); }
    };
  }
}
</script>
</body>
</html>
